version: 2
updates:
  # Application/library dependencies across the pnpm workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      dev-tooling:
        patterns:
          - 'eslint*'
          - 'prettier'
          - 'typescript*'
          - 'ts-*'
          - 'jest'
          - '@types/*'

  # Keep the CI actions themselves patched.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
