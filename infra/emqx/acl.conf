%% Obrigada authorization rules. Matched top to bottom; first match wins.
%% Username is the client certificate CN (mqtt.peer_cert_as_username = cn).

%% The backend ingestion service (CN=backend) routes the whole fleet.
{allow, {username, "backend"}, all, ["#"]}.

%% A device may publish only to its own event and heartbeat topics.
{allow, all, publish, ["obrigada/dev/${username}/events", "obrigada/dev/${username}/heartbeat"]}.

%% A device may subscribe only to its own command and ack topics.
{allow, all, subscribe, ["obrigada/dev/${username}/cmd", "obrigada/dev/${username}/ack"]}.

%% Everything else is denied (also enforced by authorization.no_match = deny).
{deny, all}.
