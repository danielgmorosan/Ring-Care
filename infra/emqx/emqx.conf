## Obrigada EMQX broker — dev configuration.
## Mutual-TLS only device link with per-device authorization.

## This file fully replaces the image's default emqx.conf, so the required node
## block must be present (its absence aborts boot with required_field errors).
## The cookie is DEV-ONLY; production gets one from the vault.
node {
  name = "emqx@127.0.0.1"
  cookie = "obrigada-dev-only-cookie"
  data_dir = "data"
}

## Mutual-TLS MQTT listener. Only clients presenting a certificate signed by our
## CA may connect (fail_if_no_peer_cert), and the cert is verified (verify_peer).
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    certfile = "/opt/emqx/etc/certs/server.crt"
    keyfile = "/opt/emqx/etc/certs/server.key"
    verify = verify_peer
    fail_if_no_peer_cert = true
  }
}

## No plaintext listener — the device link is TLS 1.3 mutual auth, period.
## ("enabled" is the field recognized across all 5.x; "enable" is a newer alias.)
listeners.tcp.default { enabled = false }
listeners.ws.default { enabled = false }
listeners.wss.default { enabled = false }

mqtt {
  ## Use the client certificate CN as the MQTT username so authorization rules can
  ## key on the device id (CN = deviceId; the backend client's CN = "backend").
  peer_cert_as_username = "cn"
}

## File-based authorization: default deny, per-device topic isolation. This is the
## fleet-level blast-radius containment — one compromised device cert cannot touch
## another device's topics.
authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    { type = file, enable = true, path = "/opt/emqx/etc/acl.conf" }
  ]
}
